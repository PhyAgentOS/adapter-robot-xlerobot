#! test_action_source 驱动 task_robot + mujoco（xlerobot）
#! 前置：设置 FORGE_RUNTIME_ROOT 指向 forge_runtime 工作区根（见本目录 README）
#! 运行: dora build dataflow.test_action_source.yaml --uv && dora run dataflow.test_action_source.yaml --uv

nodes:
  - id: mujoco
    path: ${FORGE_RUNTIME_ROOT}/packages/nodes/simulators/mujoco/main.py
    inputs:
      tick: dora/timer/millis/20
      action: task_robot/action
    outputs:
      - proprio_state
    args: --config simulator.yaml

  - id: task_robot
    path: ${FORGE_RUNTIME_ROOT}/packages/nodes/task_robot/main.py
    inputs:
      tick: dora/timer/millis/20
      action: test_action_source/action
      proprio_state: mujoco/proprio_state
    outputs:
      - action
      - proprio_state
    args: --config task_robot.yaml

  - id: test_action_source
    path: ${FORGE_RUNTIME_ROOT}/packages/nodes/test_action_source/main.py
    inputs:
      tick: dora/timer/millis/200
      proprio_state: task_robot/proprio_state
    outputs:
      - action
    args: >-
      --joint-order slide_joint_x slide_joint_y hinge_joint_z Rotation_R Pitch_R Elbow_R Wrist_Pitch_R Wrist_Roll_R Jaw_R Rotation_L Pitch_L Elbow_L Wrist_Pitch_L Wrist_Roll_L Jaw_L ST3215_Servo_Motor-v1-1_Hub-2---Servo ST3215_Servo_Motor-v1-2_Hub---Servo ST3215_Servo_Motor-v1_Revolute-40
      --mode sweep

